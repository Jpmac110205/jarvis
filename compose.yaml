services:
  backend:
    image: prodigy-backend
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: development
      PORT: 8080
      FRONTEND_URL: http://localhost:8000/app
      REDIRECT_URI: http://localhost:8000/auth/google/callback
      CORS_ORIGINS: http://localhost:8000
    ports:
      - "8080:8080"
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --reload
    volumes:
      - ./backend:/app/backend
  memory-worker:
    image: prodigy-backend
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: development
    command: ["python", "-m", "scripts.memory_worker"]
    init: true
    depends_on:
      - backend
    volumes:
      - ./backend:/app/backend
