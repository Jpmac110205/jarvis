services:
  - type: web
    name: prodigy
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: CHROMA_API_KEY
        sync: false
      - key: CHROMA_TENANT
        sync: false
      - key: CHROMA_DATABASE
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
  - type: worker
    name: prodigy-memory-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m scripts.memory_worker
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromService:
          type: web
          name: prodigy
          envVarKey: DATABASE_URL
      - key: OPENAI_API_KEY
        fromService:
          type: web
          name: prodigy
          envVarKey: OPENAI_API_KEY
      - key: OPENAI_MODEL
        fromService:
          type: web
          name: prodigy
          envVarKey: OPENAI_MODEL
      - key: EMBEDDING_MODEL
        fromService:
          type: web
          name: prodigy
          envVarKey: EMBEDDING_MODEL
      - key: CHROMA_API_KEY
        fromService:
          type: web
          name: prodigy
          envVarKey: CHROMA_API_KEY
      - key: CHROMA_TENANT
        fromService:
          type: web
          name: prodigy
          envVarKey: CHROMA_TENANT
      - key: CHROMA_DATABASE
        fromService:
          type: web
          name: prodigy
          envVarKey: CHROMA_DATABASE
